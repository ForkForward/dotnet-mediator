# Zensical configuration for the ForkForward.Mediator documentation.
#
# Published to https://forkforward.dev/dotnet-mediator/ by .github/workflows/docs.yml.
# Preview it locally:
#
#   pip install -r docs/requirements.txt
#   zensical serve          # http://localhost:8000/dotnet-mediator/
#
# The pages were written for this fork from its code, its tests and its samples. The original MediatR documentation
# was a GitHub wiki, which is not part of the source code and is not used here. ForkForward.Mediator is a community
# fork of MediatR; see NOTICE.md in the repository root.

[project]
site_name = "ForkForward.Mediator"
site_description = "Community fork of MediatR 12, the simple mediator implementation for .NET, under the Apache License 2.0."
site_author = "ForkForward contributors"
site_url = "https://forkforward.dev/dotnet-mediator/"
copyright = "Copyright &copy; Jimmy Bogard and MediatR contributors. Modifications and documentation &copy; 2026 ForkForward contributors. Apache License 2.0."

repo_url = "https://github.com/ForkForward/dotnet-mediator"
repo_name = "ForkForward/dotnet-mediator"
edit_uri = "edit/main/docs/source/"

# The same layout as the other ForkForward projects: pages in docs/source, the generator's version in
# docs/requirements.txt, and the site in artifacts/docs, like the rest of the build output.
docs_dir = "docs/source"
site_dir = "artifacts/docs"

nav = [
  { "Home" = "index.md" },
  { "Overview" = [
    "Getting-started.md",
    "Moving-from-MediatR-12.md",
  ] },
  { "Features" = [
    "Requests.md",
    "Notifications.md",
    "Streams.md",
    "Pipeline-behaviors.md",
    "Exception-handling.md",
    "Dependency-injection.md",
  ] },
]

# ForkForward colours: navy and the blue of the origin node (assets/brand/README.md).
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "img/logo.png"
favicon = "img/logo.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ForkForward/dotnet-mediator"
name = "Source code on GitHub"

[[project.extra.social]]
icon = "simple/nuget"
link = "https://www.nuget.org/packages/ForkForward.Mediator"
name = "ForkForward.Mediator on nuget.org"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

name: Dependency review

# Looks at the dependencies a pull request adds or updates, Dependabot's pull requests included,
# and fails when one of them has a known vulnerability or a licence that is not on the list.
# AI_POLICY.md allows third-party code only under a licence compatible with the Apache License 2.0.
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  review:
    name: review dependency changes
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Dependency review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate
        # Permissive licences only. A dependency with any other licence needs a maintainer's decision.
        allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0, PostgreSQL, Zlib, MS-PL

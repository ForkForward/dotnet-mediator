name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 10 SDK builds everything. The tests target net8.0 and need the .NET 8 runtime.
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.os }}
        # The package and its symbols, and the test results.
        path: |
          artifacts/**
          test/**/TestResults/**

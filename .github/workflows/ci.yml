name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Nothing the original repository committed after the fork point may enter this one
  # (AI_POLICY.md, section 4). A ruleset on main already rejects GitHub's "Sync fork";
  # this job catches the other route, a pull request that merges the original's branches.
  # It cannot see code that was copied by hand.
  origin:
    name: origin guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: No commit made in the original repository after v12.5.0
      shell: bash
      run: |
        # The first commit made in LuckyPennySoftware/MediatR after v12.5.0 (8a64581e).
        # Every later commit on its main and release branches descends from it.
        first_after_fork_point=3f5c3eca8db07e3791f638243bbb879ef847c09e
        if git rev-list HEAD | grep -q "^${first_after_fork_point}$"; then
          echo "::error::This history contains commits made in the original MediatR repository after v12.5.0. They are under a different licence and must not be merged. See AI_POLICY.md, section 4."
          exit 1
        fi
        echo "No commit made in the original repository after v12.5.0 is in this history."
  # The library published with Native AOT and run: no JIT, and nothing the compiler has not seen.
  # See AotTest.ps1 and test/ForkForward.Mediator.AotTests.
  aot:
    name: native aot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 11 SDK publishes for both target frameworks; the .NET 10 SDK is not needed.
        dotnet-version: 11.0.x
    # Native AOT links with the platform's toolchain. Windows runners have the Visual Studio C++ tools.
    - name: Native toolchain (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev
    - name: Publish with Native AOT and run
      run: ./AotTest.ps1
      shell: pwsh
    # The same scenarios in an application that is trimmed but keeps its JIT.
    - name: Publish trimmed and run
      run: ./AotTest.ps1 -Trimmed
      shell: pwsh
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 11 SDK builds everything: the library has a net11.0 target. The tests run on .NET 10 and on .NET 11.
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.os }}
        # Test results and packages only; artifacts/bin and artifacts/obj are build output.
        path: |
          artifacts/TestResults/**
          artifacts/package/**
